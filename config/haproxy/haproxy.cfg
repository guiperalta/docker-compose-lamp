# One front per project: the project's HTTP port answers plain HTTP AND TLS.
# Why: Chrome upgrades http://localhost:PORT to https://localhost:PORT; without this the upgrade
# hits a plain-HTTP port and shows ERR_SSL_PROTOCOL_ERROR. We sniff the first bytes (TLS ClientHello
# vs HTTP) and forward the raw TCP stream to Apache's 443 or 80. No TLS is terminated here.
global
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client  1h
    timeout server  1h

frontend in
    bind *:8000
    tcp-request inspect-delay 3s
    tcp-request content accept if { req.ssl_hello_type 1 }
    tcp-request content accept if { req.len gt 0 }
    use_backend tls if { req.ssl_hello_type 1 }
    default_backend plain

backend tls
    server web webserver:443

backend plain
    server web webserver:80

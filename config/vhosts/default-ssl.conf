<IfModule mod_ssl.c>
	<VirtualHost *:443>
		ServerAdmin webmaster@localhost
		DocumentRoot /var/www/html
	RewriteEngine On
	RewriteCond %{REQUEST_URI} (^/|&)(gclid|gbraid|wbraid|fbclid|msclkid|ttclid|_gl|utm_[a-z]+)= [NC]
	RewriteRule ^ /pages/errors/tracking-url.php [L]

		<Directory /var/www/html>
			AllowOverride All
			Require all granted
		</Directory>

		ErrorLog ${APACHE_LOG_DIR}/error.log
		CustomLog ${APACHE_LOG_DIR}/access.log combined

		SSLEngine on
		SSLCertificateFile      /etc/apache2/ssl/dev-selfsigned.crt
		SSLCertificateKeyFile   /etc/apache2/ssl/dev-selfsigned.key

		<FilesMatch "\.(?:cgi|shtml|phtml|php)$">
			SSLOptions +StdEnvVars
		</FilesMatch>
	</VirtualHost>
</IfModule>

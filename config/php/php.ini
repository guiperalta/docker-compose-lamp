; Shared dev php.ini for all lamp projects (mounted into every web container and phpMyAdmin).
; Per-project overrides: use .htaccess / ini_set in the project, or its own mount.
file_uploads = On
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
date.timezone = America/Sao_Paulo
log_errors = On

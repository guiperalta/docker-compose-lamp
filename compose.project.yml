# BUILD_CONTEXT / BUILD_DOCKERFILE / WEB_IMAGE are set by ./lamp (base image or projects/<name>.Dockerfile layer)
# One web container per project. Managed by ./lamp (needs PROJECT_* vars from projects/<name>.env)
services:
  webserver:
    build:
      context: ${BUILD_CONTEXT}
      dockerfile: ${BUILD_DOCKERFILE}
    image: "${WEB_IMAGE}"
    container_name: "lamp-${PROJECT_NAME}"
    restart: "no"
    ports:
      - "${HTTPS_PORT}:443"
    volumes:
      - ${PROJECT_DIR}:/var/www/html:rw
      - ${PHP_INI-./config/php/php.ini}:/usr/local/etc/php/php.ini
      - ${SSL_DIR-./config/ssl}:/etc/apache2/ssl/
      - ${VHOSTS_DIR-./config/vhosts}:/etc/apache2/sites-enabled
      - ./logs/${PROJECT_NAME}/apache2:/var/log/apache2
      - ./logs/${PROJECT_NAME}/xdebug:/var/log/xdebug
    environment:
      APACHE_DOCUMENT_ROOT: ${APACHE_DOCUMENT_ROOT-/var/www/html}
      PMA_PORT: ${HOST_MACHINE_PMA_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      HOST_MACHINE_MYSQL_PORT: ${HOST_MACHINE_MYSQL_PORT}
      XDEBUG_CONFIG: "client_host=host.docker.internal remote_port=${XDEBUG_PORT}"
      TZ: "America/Sao_Paulo"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - lamp-net
  # Publishes HTTP_PORT and answers both plain HTTP and TLS on it (see config/haproxy/haproxy.cfg)
  front:
    image: haproxy:3.0-alpine
    container_name: "lamp-${PROJECT_NAME}-front"
    restart: "no"
    depends_on:
      - webserver
    ports:
      - "${HTTP_PORT}:8000"
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - default
networks:
  lamp-net:
    external: true
    name: lamp-net
